name: melodia
description: "Melodia — Apple Music-style music player"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0
  shared_preferences: ^2.3.5
  flutter_secure_storage: ^9.2.4
  just_audio: ^0.9.43
  audio_service: ^0.18.17
  audio_session: ^0.1.22
  cached_network_image: ^3.4.1
  web: ^1.1.1
  connectivity_plus: ^7.3.2
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
